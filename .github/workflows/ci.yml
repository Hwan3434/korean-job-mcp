name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Check imports
        run: |
          uv run python -c "
          import asyncio
          from korean_job_mcp.server import mcp
          tools = asyncio.run(mcp.list_tools())
          print(f'MCP server OK: {len(tools)} tools registered')
          for t in tools:
              print(f'  - {t.name}')
          "
